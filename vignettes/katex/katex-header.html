<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/mvrem-tips.js"></script>  <!-- tooltips of latexEquation(m, annotate = "tooltip") -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var els = document.querySelectorAll("span.math");
  for (var i = 0; i < els.length; i++) {
    katex.render(els[i].textContent, els[i], {
      displayMode: els[i].classList.contains("display"),
      throwOnError: false,
      trust: true, strict: "ignore"   // \htmlData{} of latexEquation(annotate = "tooltip")
    });
  }
});
</script>
